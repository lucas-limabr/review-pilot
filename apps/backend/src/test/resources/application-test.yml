spring:
  datasource:
    url: jdbc:h2:mem:reviewpilot_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

reviewpilot:
  environment: test
  security:
    internal-service-token: test-internal-service-token-32-bytes-long-0001
    github-webhook-secret: test-github-webhook-secret-32-bytes-long-0001
  n8n:
    internal-webhook-url: http://localhost:5678/webhook/reviewpilot-dispatch

