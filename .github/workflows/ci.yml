name: ReviewPilot CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend-verify:
    name: Backend (Java 21 + Spring Boot + N8n Sanitization & Contract Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
          cache-dependency-path: "apps/backend/pom.xml"

      - name: Run Backend Build, Static Compiler Lint, and Test Suite
        working-directory: apps/backend
        run: ./mvnw -B clean test

  frontend-verify:
    name: Frontend (React 19 + TypeScript Strict + Vitest + Production Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "apps/frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run TypeScript Strict Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Run Frontend Unit & Component Tests
        working-directory: apps/frontend
        run: npm test

      - name: Build Production Bundle & Verify No Leaked Secrets
        working-directory: apps/frontend
        run: |
          npm run build
          ! grep -E -i -r "(AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|squ_[A-Za-z0-9_]+|CHANGE_ME_LOCALLY)" dist/

