name: reviewpilot

services:
  postgres:
    image: postgres:17.2-alpine
    container_name: reviewpilot-postgres
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-reviewpilot}
      POSTGRES_USER: ${POSTGRES_USER:-reviewpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reviewpilot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.4
    container_name: reviewpilot-n8n
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-UTC}
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      WEBHOOK_URL: ${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - reviewpilot-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    profiles: ["backend", "full"]
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: reviewpilot/backend:0.1.0-local
    container_name: reviewpilot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TIMEZONE:-UTC}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reviewpilot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reviewpilot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required in .env}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET is required in .env}
      N8N_INTERNAL_WEBHOOK_URL: ${N8N_INTERNAL_WEBHOOK_URL:-http://n8n:5678/webhook/reviewpilot-dispatch}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - reviewpilot-net

  frontend:
    profiles: ["frontend", "full"]
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    image: reviewpilot/frontend:0.1.0-local
    container_name: reviewpilot-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    networks:
      - reviewpilot-net

  sonarqube:
    profiles: ["quality"]
    image: sonarqube:25.1.0.102122-community
    container_name: reviewpilot-sonarqube
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      TZ: ${TIMEZONE:-UTC}
    ports:
      - "127.0.0.1:${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - reviewpilot-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  sonarqube-mcp:
    profiles: ["quality"]
    image: sonarsource/sonarqube-mcp:1.21.0.2975
    container_name: reviewpilot-sonarqube-mcp
    init: true
    restart: unless-stopped
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONARQUBE_URL: ${SONARQUBE_URL:-http://sonarqube:9000}
      SONARQUBE_TRANSPORT: ${SONARQUBE_TRANSPORT:-http}
      SONARQUBE_HTTP_HOST: ${SONARQUBE_HTTP_HOST:-0.0.0.0}
      SONARQUBE_HTTP_PORT: ${SONARQUBE_HTTP_PORT:-8080}
      SONARQUBE_MCP_IN_CONTAINER: ${SONARQUBE_MCP_IN_CONTAINER:-true}
      SONARQUBE_READ_ONLY: ${SONARQUBE_READ_ONLY:-true}
    expose:
      - "${SONARQUBE_HTTP_PORT:-8080}"
    networks:
      - reviewpilot-net

volumes:
  postgres_data:
    name: reviewpilot_postgres_data
  n8n_data:
    name: reviewpilot_n8n_data
  sonarqube_data:
    name: reviewpilot_sonarqube_data
  sonarqube_extensions:
    name: reviewpilot_sonarqube_extensions
  sonarqube_logs:
    name: reviewpilot_sonarqube_logs

networks:
  reviewpilot-net:
    name: reviewpilot-net
    driver: bridge

